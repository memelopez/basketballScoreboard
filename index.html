<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSS -->
   <link rel="stylesheet" href="index.css">
  <title>Basketball Scorebaord</title>
</head>
<body>
  <div class="mainContainer">
    <h1>Basketball Scoreboard 🏀</h1>
    <div class="SCcontainer">
      <div class="homeScore">
        <h2>HOME</h2>
        <span id="home">11</span>
        <div class="btnsHome">
          <button onclick="add1home()">+1</button>
          <button onclick="add2home()">+2</button>
          <button onclick="add3home()">+3</button>
        </div>
      </div>
      <div class="guestScore">
        <h2>GUEST</h2>
        <span id="guest">10</span>
        <div class="btnsGuest">
          <button onclick="add1guest()">+1</button>
          <button onclick="add2guest()">+2</button>
          <button onclick="add3guest()">+3</button>
        </div>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
